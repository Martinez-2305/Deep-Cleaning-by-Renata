  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div class="footer-brand">
        <picture>
          <source type="image/webp" srcset="{{base}}assets/img/logo-360.webp">
          <img src="{{base}}assets/img/logo-360.jpg" width="360" height="205" alt="{{attr:business.name}}" loading="lazy">
        </picture>
        <p>{{business.companyDetails}}</p>
      </div>
      <div>
        <h2 class="footer-title">Contact</h2>
        <ul class="footer-list">
          <li><a href="{{attr:whatsappHref}}">WhatsApp {{business.owner}}</a></li>
          <li><a href="{{attr:phoneHref}}">{{business.phoneDisplay}}</a></li>
          <li><a href="{{attr:mailHref}}">{{business.email}}</a></li>
          <li>{{coverage}}</li>
        </ul>
      </div>
      <div>
        <h2 class="footer-title">Services</h2>
        <ul class="footer-list">
          {{#each services}}<li><a href="{{#if .page}}{{base}}{{attr:.id}}/{{/if .page}}{{#unless .page}}{{attr:home}}#{{attr:.id}}{{/unless .page}}">{{.name}}</a></li>{{/each services}}
        </ul>
      </div>
    </div>
    <div class="wrap footer-base">
      <p>© {{year}} {{business.name}}</p>
      <a href="{{base}}{{attr:site.privacyPath}}">Privacy notice</a>
    </div>
  </footer>

  <div class="mobile-bar" id="mobile-bar">
    <a class="btn btn-secondary" href="{{attr:whatsappHref}}">
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
      WhatsApp
    </a>
    <a class="btn btn-primary" href="{{attr:home}}#quote">Get a quote</a>
  </div>
